name: Build & Package Desktop Releases

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ==========================================
  # Linux Desktop Release Build
  # ==========================================
  build-linux:
    name: Build Linux Desktop (x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libnotify-bin

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis & Tests
        run: |
          flutter analyze
          flutter test --exclude-tags integration

      - name: Build Standalone Linux Executable
        run: flutter build linux --release

      - name: Bundle Linux Engine Subsystem (yt-dlp & FFmpeg)
        run: |
          dest="build/linux/x64/release/bundle"
          echo "Fetching official standalone yt-dlp..."
          curl -L -o "$dest/yt-dlp" "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp"
          chmod +x "$dest/yt-dlp"
          echo "Fetching official static FFmpeg..."
          curl -L -o "ffmpeg.tar.xz" "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"
          mkdir -p ffmpeg_extracted
          tar -xf ffmpeg.tar.xz -C ffmpeg_extracted --strip-components 1
          cp ffmpeg_extracted/ffmpeg "$dest/ffmpeg"
          cp ffmpeg_extracted/ffprobe "$dest/ffprobe"
          chmod +x "$dest/ffmpeg" "$dest/ffprobe"
          rm -rf ffmpeg.tar.xz ffmpeg_extracted
        shell: bash

      - name: Package Linux Release Tarball
        run: |
          cd build/linux/x64/release/bundle
          tar -czvf ../../../../../VINX-linux-x64.tar.gz *
        shell: bash

      - name: Upload Linux Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VINX-linux-x64
          path: VINX-linux-x64.tar.gz

  # ==========================================
  # Windows Desktop Release (.exe) Build
  # ==========================================
  build-windows:
    name: Build Windows Desktop (.exe x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Standalone Windows .exe Bundle
        run: flutter build windows --release

      - name: Bundle Windows Engine Subsystem (yt-dlp & FFmpeg)
        run: |
          $dest = "build\windows\x64\runner\Release"
          Write-Host "Fetching official standalone yt-dlp.exe..."
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "$dest\yt-dlp.exe"
          Write-Host "Fetching official standalone FFmpeg..."
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
          Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffmpeg.exe" | Move-Item -Destination "$dest\ffmpeg.exe" -Force
          Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffprobe.exe" | Move-Item -Destination "$dest\ffprobe.exe" -Force
          Remove-Item -Recurse -Force "ffmpeg.zip", "ffmpeg_extracted"
        shell: pwsh

      - name: Package Windows Release Zip
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath VINX-windows-x64.zip
        shell: pwsh

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VINX-windows-x64
          path: VINX-windows-x64.zip

  # ==========================================
  # Publish to GitHub Releases (on tag push)
  # ==========================================
  publish-release:
    name: Publish Release Assets
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: VINX-linux-x64

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: VINX-windows-x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VINX-linux-x64.tar.gz
            VINX-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
