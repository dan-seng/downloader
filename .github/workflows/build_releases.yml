name: Build & Package Desktop Releases

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ==========================================
  # Linux Desktop Release Build
  # ==========================================
  build-linux:
    name: Build Linux Desktop (x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libnotify-bin

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis & Tests
        run: |
          flutter analyze
          flutter test --exclude-tags integration

      - name: Build Standalone Linux Executable
        run: flutter build linux --release

      - name: Bundle Linux Engine Subsystem (yt-dlp & FFmpeg)
        run: |
          dest="build/linux/x64/release/bundle"
          echo "Fetching official standalone yt-dlp..."
          curl -L -o "$dest/yt-dlp" "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp"
          chmod +x "$dest/yt-dlp"
          echo "Fetching official static FFmpeg..."
          curl -L -o "ffmpeg.tar.xz" "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"
          mkdir -p ffmpeg_extracted
          tar -xf ffmpeg.tar.xz -C ffmpeg_extracted --strip-components 1
          cp ffmpeg_extracted/ffmpeg "$dest/ffmpeg"
          cp ffmpeg_extracted/ffprobe "$dest/ffprobe"
          chmod +x "$dest/ffmpeg" "$dest/ffprobe"
          rm -rf ffmpeg.tar.xz ffmpeg_extracted
        shell: bash

      - name: Package Linux Release Tarball
        run: |
          cd build/linux/x64/release/bundle
          tar -czvf ../../../../../VINX-linux-x64.tar.gz *
        shell: bash

      - name: Package Linux Debian (.deb) Installer
        run: |
          mkdir -p deb_pkg/opt/vinx
          mkdir -p deb_pkg/usr/bin
          mkdir -p deb_pkg/usr/share/applications
          mkdir -p deb_pkg/usr/share/icons/hicolor/256x256/apps
          mkdir -p deb_pkg/DEBIAN

          cp -r build/linux/x64/release/bundle/* deb_pkg/opt/vinx/
          ln -s /opt/vinx/video_downloader deb_pkg/usr/bin/vinx

          cat << 'EOF' > deb_pkg/usr/share/applications/vinx.desktop
[Desktop Entry]
Name=VINX
Comment=Modern Desktop Video Downloader
Exec=/opt/vinx/video_downloader
Icon=vinx
Terminal=false
Type=Application
Categories=AudioVideo;Audio;Video;Network;
EOF

          cp assets/icon.png deb_pkg/usr/share/icons/hicolor/256x256/apps/vinx.png

          cat << 'EOF' > deb_pkg/DEBIAN/control
Package: vinx
Version: 1.0.0
Section: utils
Priority: optional
Architecture: amd64
Maintainer: VINX <support@vinx.app>
Description: VINX - Modern Desktop Video Downloader
 Powerful cross-platform desktop video and audio downloader powered by yt-dlp and FFmpeg.
EOF

          dpkg-deb --build deb_pkg VINX-linux-amd64.deb
          rm -rf deb_pkg
        shell: bash

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VINX-linux-x64
          path: |
            VINX-linux-amd64.deb
            VINX-linux-x64.tar.gz

  # ==========================================
  # Windows Desktop Release (.exe) Build
  # ==========================================
  build-windows:
    name: Build Windows Desktop (.exe x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Standalone Windows .exe Bundle
        run: flutter build windows --release

      - name: Bundle Windows Engine Subsystem (yt-dlp & FFmpeg)
        run: |
          $dest = "build\windows\x64\runner\Release"
          Write-Host "Fetching official standalone yt-dlp.exe..."
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "$dest\yt-dlp.exe"
          Write-Host "Fetching official standalone FFmpeg..."
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
          Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffmpeg.exe" | Move-Item -Destination "$dest\ffmpeg.exe" -Force
          Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffprobe.exe" | Move-Item -Destination "$dest\ffprobe.exe" -Force
          Remove-Item -Recurse -Force "ffmpeg.zip", "ffmpeg_extracted"
        shell: pwsh

      - name: Install Inno Setup
        run: |
          choco install innosetup -y
        shell: pwsh

      - name: Compile Windows Setup Installer (.exe)
        run: |
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc windows\installer\vinx_setup.iss
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\iscc.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" windows\installer\vinx_setup.iss
          } elseif (Test-Path "C:\Program Files\Inno Setup 6\iscc.exe") {
            & "C:\Program Files\Inno Setup 6\iscc.exe" windows\installer\vinx_setup.iss
          } else {
            throw "Inno Setup compiler (iscc.exe) not found"
          }
        shell: pwsh

      - name: Package Windows Release Zip
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath VINX-windows-x64.zip
        shell: pwsh

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VINX-windows-x64
          path: |
            VINX-windows-setup-x64.exe
            VINX-windows-x64.zip

  # ==========================================
  # Publish to GitHub Releases (on tag push)
  # ==========================================
  publish-release:
    name: Publish Release Assets
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: VINX-linux-x64

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: VINX-windows-x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VINX-windows-setup-x64.exe
            VINX-windows-x64.zip
            VINX-linux-amd64.deb
            VINX-linux-x64.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
